    .btn-primary { background:var(--accent); color:#14140F; }
    .btn-ghost { background:transparent; color:var(--text); border:1px solid var(--border); }

    .timer-ring-bg { fill:none; stroke:var(--border); stroke-width:5; }
    .timer-ring-fg { fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:round; transition:stroke-dashoffset 1s linear; }
    .timer-clock { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:700; }

    .timer-running .timer-clock { font-size:39px; letter-spacing:-1px; }

    .timer-running .timer-workout-name { font-size:15px; color:var(--text); }
    .timer-running .timer-main { justify-content:center; }

    .mini-field { display:flex; flex-direction:column; gap:6px; align-items:center; }
    .mini-field span { font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; }
    .bw-input-row { display:flex; gap:11px; }
    .bw-input-row .input { margin-bottom:0; }
    .history-card-header { width:100%; background:none; border:none; color:var(--text); display:flex; align-items:center; justify-content:between; cursor:pointer; padding:0; text-align:left; }
    .chevron { transition:transform .2s; color:var(--text-dim); flex-shrink:0; }

    .history-detail { margin-top:16px; padding-top:16px; border-top:1px solid var(--border); }

    .history-ex-name { font-weight:600; font-size:16px; margin:0 0 9px; }
    .history-set-row { display:flex; align-items:center; gap:13px; font-size:14px; color:var(--text-dim); padding:5px 0; }
    .mono { font-family:'IBM Plex Mono',monospace; color:var(--text); font-size:15px; }
    @media (max-width:380px) {

      body { padding:18px 0; }

    }
  </style>
</head>

async function beepThreeTimes() {
  for (let i = 0; i < 3; i++) {
    await beep();
    if (i < 2) {
      await new Promise(resolve => setTimeout(resolve, 100));
    }
  }
}

function beep() {
  return new Promise(resolve => {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "triangle";
      osc.frequency.value = 500;

      osc.connect(gain);
      gain.connect(ctx.destination);

      gain.gain.setValueAtTime(1.0, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);

      osc.onended = () => {
        ctx.close?.();
        resolve();
      };
    } catch (e) {
      resolve();
    }
  });
}

function RoutineEditor({draft,isNew,onChangeName,onAddExercise,onUpdateExercise,onRemoveExercise,onSave,onDelete,onClose}){
 return <div className="modal-overlay" style={{zIndex:10}} onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-header"><h3 className="modal-title">{isNew?"New Routine":"Edit Routine"}</h3><button className="icon-btn" onClick={onClose}><X size={24}/></button></div>
 <label className="field-label">Routine name</label><input className="input" value={draft.name} onChange={e=>onChangeName(e.target.value)} placeholder="e.g. Leg Day" autoFocus/><label className="field-label" style={{marginTop:18}}>Exercises</label>
 <div className="picker-list" style={{maxHeight:320}}>{draft.exercises.length===0&&<EmptyState icon={Dumbbell} title="No exercises added"/>}{draft.exercises.map((re,idx)=><div className="routine-editor-row" key={idx}><div className="routine-editor-row-top"><span className="picker-row-name">{re.name}</span><button className="icon-btn icon-btn-ghost" onClick={()=>onRemoveExercise(idx)}><X size={18}/></button></div><div className="routine-editor-inputs">{[["Sets","targetSets"],["Reps","targetReps"],["Weight (lb)","targetWeight"]].map(([lab,field])=><div className="mini-field" key={field}><span>{lab}</span><input className="input input-mini" type={field==="targetReps"?"text":"number"} inputMode={field==="targetReps"?"numeric":"decimal"} value={re[field]} onChange={e=>onUpdateExercise(idx,field,field==="targetWeight"?e.target.value:(field==="targetReps"?e.target.value:Number(e.target.value)))}/></div >)}</div></div>)}</div>
 <button className="btn btn-ghost full-width" onClick={onAddExercise}><Plus size={20}/> Add Exercise</button><div className="modal-btn-row" style={{marginTop:20}}>{!isNew&&<button className="btn btn-danger" onClick={onDelete}>Delete</button>}<button className="btn btn-primary" style={{flex:1}} disabled={!draft.name.trim()||draft.exercises.length===0} onClick={onSave}>Save Routine</button></div>
 </div></div>
}
function ExercisesTab({exercises,onNewExercise,onSelectExercise}){
 const [search,setSearch]=useState(""),[muscle,setMuscle]=useState("All");
 const filtered=exercises.filter(e=>(muscle==="All"||e.muscle===muscle)&&e.name.toLowerCase().includes(search.toLowerCase())),grouped={};
 filtered.forEach(e=>(grouped[e.muscle]??=[]).push(e));
 return <div><SectionTitle right={<button className="btn btn-primary btn-sm" onClick={onNewExercise}><Plus size={18}/> New</button>}>Exercise Library</SectionTitle><div className="search-row"><input className="input search-input" placeholder="Search exercises" value={search} onChange={e=>setSearch(e.target.value)}/></div><div className="chip-row"><MuscleChip label="All" active={muscle==="All"} onClick={()=>setMuscle("All")}/>{MUSCLES.map(m=><MuscleChip key={m} label={m} active={muscle===m} onClick={()=>setMuscle(m)}/>)}</div>{!Object.keys(grouped).length&&<EmptyState icon={Search} title="No exercises found"/>}{Object.entries(grouped).map(([m,list])=><div key={m} style={{marginBottom:22}}><p className="muscle-group-label">{m}</p>{list.map(ex=><div className="card exercise-row" key={ex.id} onClick={()=>onSelectExercise(ex)} style={{cursor:"pointer"}}><div><div className="picker-row-name">{ex.name}</div><div className="picker-row-sub">{ex.equipment}{ex.custom?" · Custom":""}</div></div><ChevronRight size={20} style={{color:"var(--text-dim)"}}/></div>)}</div>)}</div>
}
function ProgressTab({bwInput,setBwInput,onLogBw,bwChartData,exercisesWithHistory,progressExId,setProgressExId,progressData,onDeleteBw}){
 return <div>
   <SectionTitle>Progress</SectionTitle>
   <div className="card">
     <p className="field-label">Body Weight</p>
     <div className="bw-input-row">
       <input className="input" type="number" inputMode="decimal" placeholder="175" value={bwInput} onChange={e=>setBwInput(e.target.value)}/>
       <button className="btn btn-primary" onClick={onLogBw}>Log BW</button>
     </div>
     {bwChartData.length>0&&<div style={{marginTop:18,height:160}}><ResponsiveContainer width="100%" height="100%"><LineChart data={bwChartData}><CartesianGrid strokeDasharray="3 3" stroke="#33311F"/><XAxis dataKey="date" stroke="#A39C8A" fontSize={12}/><YAxis stroke="#A39C8A" fontSize={12} domain={['dataMin - 5', 'dataMax + 5']}/><Tooltip contentStyle={{background:"#1F1E18",border:"1px solid #33311F",borderRadius:12}} labelStyle={{color:"#FAF7EE"}}/><Line type="monotone" dataKey="weight" stroke="#E8B923" strokeWidth={2.5} dot={false}/></LineChart></ResponsiveContainer></div>}
     {bwChartData.length>0 && (
       <div style={{marginTop:14, display:"flex", justifyContent:"flex-end"}}>
         <button className="btn btn-danger-ghost btn-sm" onClick={onDeleteBw}><Trash2 size={16}/> Delete Latest Weight Entry</button>
       </div>
     )}
   </div>
   <SectionTitle>Exercise Progress</SectionTitle>
   {exercisesWithHistory.length===0?<EmptyState icon={TrendingUp} title="No workout history yet" sub="Finish a workout with weight/reps to see your progression charts."/>:<>
   <select className="input" value={progressExId} onChange={e=>setProgressExId(e.target.value)}>{exercisesWithHistory.map(ex=><option key={ex.id} value={ex.id}>{ex.name}</option>)}</select>
   {progressData.length>0&&<div className="card" style={{marginTop:16}}><p className="field-label">Estimated 1RM / Max Weight</p><div style={{height:200,marginTop:11}}><ResponsiveContainer width="100%" height="100%"><LineChart data={progressData}><CartesianGrid strokeDasharray="3 3" stroke="#33311F"/><XAxis dataKey="date" stroke="#A39C8A" fontSize={12}/><YAxis stroke="#A39C8A" fontSize={12}/><Tooltip contentStyle={{background:"#1F1E18",border:"1px solid #33311F",borderRadius:12}} labelStyle={{color:"#FAF7EE"}}/><Line type="monotone" dataKey="weight" name="Max Weight" stroke="#E8B923" strokeWidth={2.5}/></LineChart></ResponsiveContainer></div></div>}
   </>}
 </div>
}
function HistoryTab({history,onDeleteHistory}){
 const [openId,setOpenId]=useState(null);
 return <div>
   <SectionTitle>History</SectionTitle>
   {history.length===0?<EmptyState icon={Calendar} title="No completed workouts" sub="Completed workouts will appear here."/>:history.map(item=>{
    const isOpen=openId===item.id;
    return <div className="card" key={item.id}>
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between"}}>
        <button className="history-card-header" style={{flex:1}} onClick={()=>setOpenId(isOpen?null:item.id)}>
          <div>
            <div className="routine-card-name">{item.routineName}</div>
            <div className="routine-card-sub">{fmtDateFull(item.date)} · {fmtDuration(item.duration)}</div>
          </div>
        </button>
        <div style={{display:"flex", alignItems:"center", gap:8}}>
          <button className="icon-btn icon-btn-ghost" title="Delete History Entry" onClick={(e)=>{e.stopPropagation();onDeleteHistory(item.id);}}><Trash2 size={19}/></button>
          <ChevronRight size={22} className={`chevron${isOpen?" chevron-open":""}`} style={{cursor:"pointer"}} onClick={()=>setOpenId(isOpen?null:item.id)}/>
        </div>
      </div>
      {isOpen&&<div className="history-detail">{item.exercises.map((ex,i)=><div className="history-ex" key={i}><p className="history-ex-name">{ex.name}</p>{ex.sets.filter(s=>s.completed).map((s,si)=><div className="history-set-row" key={si}><span>Set {si+1}</span><span className="mono">{s.weight} lb × {s.reps} reps</span></div>)}</div>)}</div>}
    </div>
   })}
 </div>
}

function App(){
 const [booted,setBooted]=useState(false);
 const [exercises,setExercises]=useState(()=>loadKey("il_exs_v2", DEFAULT_EXERCISES));
 const [routines,setRoutines]=useState(()=>loadKey("il_rts_v2",seedRoutines(DEFAULT_EXERCISES)));
 const [history,setHistory]=useState(()=>loadKey("il_hist",[]));
 const [bodyweight,setBodyweight]=useState(()=>loadKey("il_bw",[]));
 const [tab,setTab]=useState("log");
 const [activeWorkout,setActiveWorkout]=useState(()=>loadKey("il_active",null));
 const [restDuration,setRestDuration]=useState(90);
 const [restRemaining,setRestRemaining]=useState(90);
 const [restRunning,setRestRunning]=useState(false);
 const [pickerOpen,setPickerOpen]=useState(false);
 const [pickerContext,setPickerContext]=useState(null);
 const [newExOpen,setNewExOpen]=useState(false);
 const [routineEditor,setRoutineEditor]=useState(null);
 const [discardModal,setDiscardModal]=useState(false);
 const [bwInput,setBwInput]=useState("");
 const [progressExId,setProgressExId]=useState("");
 const [selectedExerciseModal,setSelectedExerciseModal]=useState(null);

 // Deletion confirmation modal states
 const [confirmModalConfig, setConfirmModalConfig] = useState(null);

 useEffect(()=>{setBooted(true)},[]);
 useEffect(()=>{saveKey("il_exs_v2",exercises)},[exercises]);
 useEffect(()=>{saveKey("il_rts_v2",routines)},[routines]);
 useEffect(()=>{saveKey("il_hist",history)},[history]);
 useEffect(()=>{saveKey("il_bw",bodyweight)},[bodyweight]);
 useEffect(()=>{saveKey("il_active",activeWorkout)},[activeWorkout]);

 useEffect(()=>{
  let t;
  if(restRunning&&restRemaining>0){t=setInterval(()=>setRestRemaining(r=>Math.max(0,r-1)),1000)}
  else if(restRunning&&restRemaining===0){setRestRunning(false);beepThreeTimes();}
  return ()=>clearInterval(t);
 },[restRunning,restRemaining]);

 const exercisesWithHistory=useMemo(()=>{
  const setIds=new Set();
  history.forEach(h=>h.exercises.forEach(e=>e.sets.some(s=>s.completed)&&setIds.add(e.exerciseId)));
  return exercises.filter(e=>setIds.has(e.id));
 },[exercises,history]);

 useEffect(()=>{
  if(!progressExId&&exercisesWithHistory.length>0)setProgressExId(exercisesWithHistory[0].id);
 },[exercisesWithHistory,progressExId]);

 const progressData=useMemo(()=>{
  if(!progressExId)return [];
  const points=[];
  history.forEach(h=>{
   h.exercises.forEach(ex=>{
    if(ex.exerciseId===progressExId){
     const maxW=Math.max(0,...ex.sets.filter(s=>s.completed).map(s=>Number(s.weight)||0));
     if(maxW>0)points.push({date:fmtDate(h.date),weight:maxW});
    }
   });
  });
  return points;
 },[history,progressExId]);

 const bwChartData=useMemo(()=>bodyweight.map(b=>({date:fmtDate(b.date),weight:b.weight})),[bodyweight]);

 const startEmptyWorkout=()=>{
  setActiveWorkout({id:uid("wk"),routineName:"Free Workout",startTime:Date.now(),exercises:[]});
 };
 const startRoutineWorkout=r=>{
  setActiveWorkout({id:uid("wk"),routineName:r.name,startTime:Date.now(),exercises:r.exercises.map(e=>({exerciseId:e.exerciseId,name:e.name,sets:Array.from({length:e.targetSets},()=>({weight:e.targetWeight||"",reps:e.targetReps||"",completed:false}))}))});
 };

 if(!booted)return <div className="boot-screen"><div className="boot-icon"><Dumbbell size={44}/></div></div>;

 return <div className="app-shell">
 <header className="app-header"><div className="app-header-inner"><Dumbbell size={26} className="header-icon"/><span className="app-title">IRON CORE</span></div></header>
 <div className="content">
  {tab==="log"&&<LogTab activeWorkout={activeWorkout} routines={routines} exercises={exercises} onShowExerciseInfo={ex=>setSelectedExerciseModal(ex)} onStartRoutine={startRoutineWorkout} onStartEmpty={startEmptyWorkout} onAddExercise={()=>{setPickerContext("workout");setPickerOpen(true)}} onUpdateSet={(exIdx,setIdx,f,v)=>{setActiveWorkout(w=>{const next={...w,exercises:[...w.exercises]};next.exercises[exIdx]={...next.exercises[exIdx],sets:[...next.exercises[exIdx].sets]};next.exercises[exIdx].sets[setIdx]={...next.exercises[exIdx].sets[setIdx],[f]:v};return next})}} onToggleSet={(exIdx,setIdx)=>{setActiveWorkout(w=>{const next={...w,exercises:[...w.exercises]};next.exercises[exIdx]={...next.exercises[exIdx],sets:[...next.exercises[exIdx].sets]};const c=!next.exercises[exIdx].sets[setIdx].completed;next.exercises[exIdx].sets[setIdx]={...next.exercises[exIdx].sets[setIdx],completed:c};return next});setRestRemaining(restDuration);setRestRunning(true)}} onAddSet={exIdx=>{setActiveWorkout(w=>{const next={...w,exercises:[...w.exercises]};const sets=next.exercises[exIdx].sets;const last=sets[sets.length-1];next.exercises[exIdx]={...next.exercises[exIdx],sets:[...sets,{weight:last?last.weight:"",reps:last?last.reps:"",completed:false}]};return next})}} onRemoveSet={(exIdx,setIdx)=>{setActiveWorkout(w=>{const next={...w,exercises:[...w.exercises]};next.exercises[exIdx]={...next.exercises[exIdx],sets:next.exercises[exIdx].sets.filter((_,i)=>i!==setIdx)};return next})}} onRemoveExercise={exIdx=>{setActiveWorkout(w=>({...w,exercises:w.exercises.filter((_,i)=>i!==exIdx)}))}} onFinish={()=>{if(!activeWorkout)return;setHistory(h=>[{...activeWorkout,id:uid("hist"),duration:Date.now()-activeWorkout.startTime,date:Date.now()},...h]);setActiveWorkout(null);setRestRunning(false);setTab("history")}} onDiscardRequest={()=>setDiscardModal(true)} restProps={{duration:restDuration,setDuration:setRestDuration,remaining:restRemaining,setRemaining:setRestRemaining,running:restRunning,setRunning:setRestRunning}}/>}
  {tab==="routines"&&<RoutinesTab routines={routines} onNew={()=>setRoutineEditor({id:uid("rt"),name:"",exercises:[],isNew:true})} onEdit={r=>setRoutineEditor({...r,isNew:false})} onStart={r=>{startRoutineWorkout(r);setTab("log")}}/>}
  {tab==="exercises"&&<ExercisesTab exercises={exercises} onNewExercise={()=>setNewExOpen(true)} onSelectExercise={ex=>setSelectedExerciseModal(ex)}/>}
  {tab==="progress"&&<ProgressTab bwInput={bwInput} setBwInput={setBwInput} onLogBw={()=>{const w=Number(bwInput);if(w>0){setBodyweight(b=>[...b,{date:Date.now(),weight:w}]);setBwInput("")}}} bwChartData={bwChartData} exercisesWithHistory={exercisesWithHistory} progressExId={progressExId} setProgressExId={setProgressExId} progressData={progressData} onDeleteBw={()=>{
    setConfirmModalConfig({
      title: "Delete Body Weight Entry?",
      message: "Are you sure you want to delete your most recent body weight log entry?",
      onConfirm: () => {
        setBodyweight(b => b.slice(0, -1));
        setConfirmModalConfig(null);
      }
    });
  }}/>}
  {tab==="history"&&<HistoryTab history={history} onDeleteHistory={id=>{
    setConfirmModalConfig({
      title: "Delete Workout History?",
      message: "Are you sure you want to delete this completed workout from your history?",
      onConfirm: () => {
        setHistory(h => h.filter(item => item.id !== id));
        setConfirmModalConfig(null);
      }
    });
  }}/>}
 </div>
 <nav className="bottom-nav">
  {[
    ["log","Start",Dumbbell],
    ["routines","Routines",ListChecks],
    ["exercises","Exercises",Search],
    ["progress","Progress",TrendingUp],
    ["history","History",Calendar]
  ].map(([id,label,Icon])=>(
    <button key={id} className={`nav-btn${tab===id?" nav-btn-active":""}`} onClick={()=>setTab(id)}>
      <Icon size={id === "exercises" ? 30 : 24}/>
      <span>{label}</span>
    </button>
  ))}
 </nav>
 {pickerOpen&&<ExercisePicker exercises={exercises} zIndex={40} onSelect={ex=>{
   if(pickerContext==="workout"){
     setActiveWorkout(w=>({...w,exercises:[...w.exercises,{exerciseId:ex.id,name:ex.name,sets:[{weight:"",reps:"",completed:false}]}]}))
   }else if(pickerContext==="routine"&&routineEditor){
     setRoutineEditor(re=>({...re,exercises:[...re.exercises,{exerciseId:ex.id,name:ex.name,targetSets:3,targetReps:10,targetWeight:0}]}))
   }
   setPickerOpen(false);
 }} onSelectAllCategory={list=>{
   if(pickerContext==="workout"){
     setActiveWorkout(w=>({
       ...w,
       exercises:[...w.exercises, ...list.map(ex => ({exerciseId:ex.id, name:ex.name, sets:[{weight:"",reps:"",completed:false}]}))]
     }))
   }else if(pickerContext==="routine"&&routineEditor){
     setRoutineEditor(re=>({
       ...re,
       exercises:[...re.exercises, ...list.map(ex => ({exerciseId:ex.id, name:ex.name, targetSets:3, targetReps:10, targetWeight:0}))]
     }))
   }
   setPickerOpen(false);
 }} onClose={()=>setPickerOpen(false)} onNewExercise={()=>{setNewExOpen(true)}}/>}
 {newExOpen&&<NewExerciseModal zIndex={50} onSave={ex=>{setExercises(e=>[...e,ex]);setNewExOpen(false)}} onClose={()=>setNewExOpen(false)}/>}
 {routineEditor&&<RoutineEditor draft={routineEditor} isNew={routineEditor.isNew} onChangeName={name=>setRoutineEditor(re=>({...re,name}))} onAddExercise={()=>{setPickerContext("routine");setPickerOpen(true)}} onUpdateExercise={(idx,f,v)=>setRoutineEditor(re=>{const next={...re,exercises:[...re.exercises]};next.exercises[idx]={...next.exercises[idx],[f]:v};return next})} onRemoveExercise={idx=>setRoutineEditor(re=>({...re,exercises:re.exercises.filter((_,i)=>i!==idx)}))} onSave={()=>{if(routineEditor.isNew){setRoutines(r=>[...r,{...routineEditor,id:uid("rt")}])}else{setRoutines(r=>r.map(item=>item.id===routineEditor.id?routineEditor:item))}setRoutineEditor(null)}} onDelete={()=>{
   setConfirmModalConfig({
     title: "Delete Routine?",
     message: "Are you sure you want to delete this routine? This action cannot be undone.",
     onConfirm: () => {
       setRoutines(r=>r.filter(item=>item.id!==routineEditor.id));
       setRoutineEditor(null);
       setConfirmModalConfig(null);
     }
   });
 }} onClose={()=>setRoutineEditor(null)}/>}
 {discardModal&&<div className="modal-overlay" style={{zIndex:20}} onClick={()=>setDiscardModal(false)}><div className="modal modal-sm" onClick={e=>e.stopPropagation()}><div className="modal-header"><h3 className="modal-title">Exit Workout?</h3></div><p style={{color:"var(--text-dim)",fontSize:16,marginBottom:22}}>Are you sure you want to exit this workout? All progress will be lost.</p><div className="modal-btn-row"><button className="btn btn-ghost" style={{flex:1}} onClick={()=>setDiscardModal(false)}>Cancel</button><button className="btn btn-danger" style={{flex:1}} onClick={()=>{setActiveWorkout(null);setRestRunning(false);setDiscardModal(false)}}>Exit</button></div></div></div>}
 {selectedExerciseModal&&<ExerciseDetailModal exercise={selectedExerciseModal} onClose={()=>setSelectedExerciseModal(null)}/>}
 {confirmModalConfig&&<ConfirmationModal title={confirmModalConfig.title} message={confirmModalConfig.message} onConfirm={confirmModalConfig.onConfirm} onClose={()=>setConfirmModalConfig(null)}/>}
 </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
