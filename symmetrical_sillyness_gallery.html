<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symmetrical Sillyness — Exercise Images</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 24px;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f4f6;
        color: #222;
    }

    h1 {
        text-align: center;
        margin: 0 0 24px;
        font-size: 28px;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 24px;
        max-width: 1400px;
        margin: 0 auto;
    }

    .card {
        background: white;
        border-radius: 10px;
        padding: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,.12);
        text-align: center;
    }

    .card img {
        display: block;
        width: 400px;
        height: 300px;
        max-width: 100%;
        margin: 0 auto;
        object-fit: contain;
        background: #eee;
        border-radius: 6px;
    }

    .filename {
        margin-top: 10px;
        font-size: 14px;
        color: #555;
        overflow-wrap: anywhere;
    }

    @media (max-width: 450px) {
        body { padding: 12px; }
        .gallery { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

<h1>Symmetrical Sillyness — Exercise Images</h1>

<div class="gallery" id="gallery"></div>

<script>
const repo = "https://raw.githubusercontent.com/ButterGumz/symmetrical-sillyness/main/assets/";

const images = [
    "flat_barbell_bench_press.jpg",
    "incline_barbell_bench_press.jpg",
    "incline_dumbbell_fly.jpg",
    "incline_dumbbell_press.jpg",
    "incline_machine_press.jpg",
    "low_to_high_cable_crossover.jpg"
];

const gallery = document.getElementById("gallery");

images.forEach(filename => {
    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = repo + encodeURIComponent(filename);
    img.alt = filename;
    img.loading = "lazy";

    const label = document.createElement("div");
    label.className = "filename";
    label.textContent = filename;

    card.appendChild(img);
    card.appendChild(label);
    gallery.appendChild(card);
});
</script>

</body>
</html>
